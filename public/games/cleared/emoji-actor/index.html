<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f4f2ed"><title>Emoji Actor</title><link rel="stylesheet" href="style.css"><script type="module" src="app.js"></script></head>
<body><main class="app-shell"><header class="topbar"><a class="brand" href="#" aria-label="Emoji Actor home"><span class="brand-mark">✳</span> little actor</a><div class="mode-switch" role="tablist" aria-label="App mode"><button class="mode-button active" id="editMode" role="tab" aria-selected="true">Edit</button><button class="mode-button" id="playMode" role="tab" aria-selected="false">Play <span class="play-glyph">▶</span></button></div><span class="saved-status" id="savedStatus">Saved</span></header>
<section class="workspace"><section class="stage" aria-label="Emoji preview"><div class="stage-topline"><span class="eyebrow">YOUR CHARACTER</span><span class="stage-dot"></span></div><button class="character" id="character" aria-label="Choose character emoji">🙂</button><div class="reaction-text" id="reactionText" aria-live="polite"></div><div class="stage-hint" id="stageHint">Choose an emoji to get started</div></section>
<section class="side-panel"><div class="panel-heading"><div><span class="eyebrow">THE SETUP</span><h1 id="sectionTitle">Interactions</h1></div><span class="count-badge" id="interactionCount">0</span></div><div class="editor-view" id="editorView"><div class="interaction-list" id="interactionList"></div><button class="add-button" id="addInteraction"><span>＋</span> Add interaction</button><div class="empty-note" id="emptyNote">Give your character something to do.</div></div><div class="play-view hidden" id="playView"><div class="play-list" id="playList"></div><p class="play-empty" id="playEmpty">Add an interaction in Edit mode to begin.</p></div></section></section><footer class="footnote"><span class="status-light"></span> Your little world is saved on this device</footer></main>
<dialog class="emoji-dialog" id="emojiDialog" aria-label="Choose an emoji"><div class="dialog-head"><div><span class="eyebrow">PICK A FACE</span><h2>Choose an emoji</h2></div><button class="icon-button close-dialog" aria-label="Close">×</button></div><div class="custom-emoji-row"><input id="customEmoji" aria-label="Enter a starting emoji" placeholder="Or enter an emoji…" autocomplete="off"><button type="button" class="save-button" id="applyCustomEmoji">Use emoji</button></div><div class="emoji-grid" id="emojiGrid"></div></dialog>
<dialog class="form-dialog" id="interactionDialog"><form id="interactionForm" method="dialog"><div class="dialog-head"><div><span class="eyebrow">MAKE IT HAPPEN</span><h2 id="formTitle">New interaction</h2></div><button type="button" class="icon-button close-form" aria-label="Close">×</button></div><label class="field-label" for="interactionName">Interaction name</label><input id="interactionName" name="name" placeholder="e.g. Say hello" maxlength="36" required autocomplete="off"><label class="field-label" for="reactionEmojis">Reaction emoji <span class="optional">optional · commas between</span></label><input id="reactionEmojis" name="emojis" placeholder="👋, ✨, 💛" autocomplete="off"><label class="field-label" for="reactionTexts">Reaction text <span class="optional">optional · periods between</span></label><textarea id="reactionTexts" name="texts" placeholder="Hey there. So nice to see you!" rows="3"></textarea><label class="field-label" for="emojiRules">Text-specific emoji <span class="optional">exact text = emoji · one per line</span></label><textarea id="emojiRules" placeholder="Hello = 👋&#10;Wow = ✨" rows="2"></textarea><label class="field-label" for="reactionDuration">Emoji lasts <span class="optional">0 = stays until next interaction</span></label><div class="duration-wrap"><input id="reactionDuration" name="duration" type="number" min="0" step="0.5" value="2"><span>seconds</span></div><div class="form-actions"><button type="button" class="cancel-button close-form">Cancel</button><button type="submit" class="save-button" id="saveInteraction">Save interaction <span>↗</span></button></div></form></dialog></body></html>
