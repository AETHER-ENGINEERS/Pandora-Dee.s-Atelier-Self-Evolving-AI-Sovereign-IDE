<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <link rel="stylesheet" href="style.css" />
  <title>Pet Creator</title>
  <script type="importmap">
  {
    "imports": {}
  }
  </script>
</head>
<body>
  <div id="app">
    <div id="creator">
      <div class="panel left">
        <div class="section">
          <div style="display:flex;flex-direction:column;gap:6px">
            <div style="display:flex;gap:8px;align-items:center;justify-content:space-between">
              <label style="flex:1">Body color
                <select id="bodyColorMode" style="margin-left:8px;height:36px;border-radius:8px">
                  <option value="solid">Solid</option>
                  <option value="gradient">Gradient</option>
                </select>
              </label>
            </div>
            <div style="display:flex;gap:8px;align-items:center">
              <input type="color" id="bodyColor" value="#ffd36b" />
              <input type="color" id="bodyColor2" value="#ffecd6" style="display:none" />
              <select id="bodyGradDir" style="height:36px;border-radius:8px;display:none">
                <option value="|">|</option>
                <option value="\\">\\</option>
                <option value="/">/</option>
                <option value="_">_</option>
              </select>
            </div>
            <div id="bodyPresets" style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px"></div>
            <!-- additional preset row for gradient second color -->
            <div id="bodyPresets2" style="display:none;flex-wrap:wrap;gap:6px;margin-top:6px"></div>
          </div>

          <div style="display:flex;gap:8px;align-items:center;margin-top:8px">
            <input type="color" id="newPresetColor" value="#ffd36b" style="width:44px;height:32px;border-radius:6px;border:none;padding:0" />
            <button id="addCustomPreset" class="smallBtn" style="padding:8px;min-height:36px">Add Preset</button>
            <button id="clearCustomPresets" class="smallBtn" style="padding:8px;min-height:36px">Clear Presets</button>
          </div>

          <div style="display:flex;align-items:center;gap:8px;margin-top:8px">
            <button id="openSettings" title="Settings" style="font-size:18px;padding:8px;border-radius:8px">⚙️</button>
          </div>
        </div>

        <div class="section">
          <div style="display:flex;flex-direction:column;gap:6px">
            <div style="display:flex;gap:8px;align-items:center;justify-content:space-between">
              <label style="flex:1">Eye color
                <select id="eyeColorMode" style="margin-left:8px;height:36px;border-radius:8px">
                  <option value="solid">Solid</option>
                  <option value="gradient">Gradient</option>
                </select>
              </label>
            </div>
            <div style="display:flex;gap:8px;align-items:center">
              <input type="color" id="eyeColor" value="#2b2b2b" />
              <input type="color" id="eyeColor2" value="#000000" style="display:none" />
              <select id="eyeGradDir" style="height:36px;border-radius:8px;display:none">
                <option value="|">|</option>
                <option value="\\">\\</option>
                <option value="/">/</option>
                <option value="_">_</option>
              </select>
            </div>
            <div id="eyePresets" style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px"></div>
            <!-- second-row presets for eye gradient second color -->
            <div id="eyePresets2" style="display:none;flex-wrap:wrap;gap:6px;margin-top:6px"></div>
          </div>

          <label style="margin-top:8px">Eye state
            <select id="eyeState" style="margin-left:8px">
              <option value="open">Both Open</option>
              <option value="leftClosed">Left Closed</option>
              <option value="rightClosed">Right Closed</option>
              <option value="bothClosed">Both Closed</option>
            </select>
          </label>
        </div>
        <div class="section">
          <div style="display:flex;flex-direction:column;gap:6px">
            <div style="display:flex;gap:8px;align-items:center;justify-content:space-between">
              <label style="flex:1">Mouth color
                <select id="mouthColorMode" style="margin-left:8px;height:36px;border-radius:8px">
                  <option value="solid">Solid</option>
                  <option value="gradient">Gradient</option>
                </select>
              </label>
            </div>
            <div style="display:flex;gap:8px;align-items:center">
              <input type="color" id="mouthColor" value="#2b2b2b" />
              <input type="color" id="mouthColor2" value="#000000" style="display:none" />
              <select id="mouthGradDir" style="height:36px;border-radius:8px;display:none">
                <option value="|">|</option>
                <option value="\\">\\</option>
                <option value="/">/</option>
                <option value="_">_</option>
              </select>
            </div>
            <div id="mouthPresets" style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px"></div>
            <!-- second-row presets for mouth gradient second color -->
            <div id="mouthPresets2" style="display:none;flex-wrap:wrap;gap:6px;margin-top:6px"></div>
          </div>

          <label style="margin-top:8px">Mouth expression
            <select id="mouthExpression" style="margin-left:8px">
              <option value="smile">Smile</option>
              <option value="neutral">Neutral</option>
              <option value="frown">Frown</option>
              <option value="open">Open (O)</option>
            </select>
          </label>
        </div>

        <div class="section">
          <div class="subhead">Patterns (max 2)</div>
          <div id="patternSlots"></div>
          <button id="addPattern">Add pattern</button>
        </div>

        <div class="section">
          <div class="subhead">Accessories (up to 3)</div>
          <div id="accessorySlots"></div>
          <button id="addAccessory">Add accessory</button>
        </div>

        <div class="section">
          <button id="toItems" class="primary">Next: Create Items</button>
          <button id="resetCreator">Reset Pet</button>
        </div>
      </div>

      <div class="panel right">
        <div id="previewWrap">
          <svg id="petSVG" viewBox="-150 -150 300 300" width="100%" height="100%"></svg>
        </div>
      </div>
    </div>

    <div id="itemsEditor" class="hidden">
      <div class="panel left">
        <div class="section">
          <label>Item emoji<input id="itemEmoji" maxlength="2" placeholder="🧸" /></label>
        </div>

        <div class="section">
          <div style="display:flex;flex-direction:column;gap:6px">
            <div style="display:flex;gap:8px;align-items:center;justify-content:space-between">
              <label style="flex:1">Item background
                <select id="itemBgMode" style="margin-left:8px;height:36px;border-radius:8px">
                  <option value="solid">Solid</option>
                  <option value="gradient">Gradient</option>
                </select>
              </label>
            </div>
            <div style="display:flex;gap:8px;align-items:center">
              <input type="color" id="itemBg" value="#ffffff" />
              <input type="color" id="itemBg2" value="#eeeeee" style="display:none" />
              <select id="itemBgGradDir" style="height:36px;border-radius:8px;display:none">
                <option value="|">|</option>
                <option value="\\">\\</option>
                <option value="/">/</option>
                <option value="_">_</option>
              </select>
            </div>
            <div id="itemBgPresets" style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px"></div>
            <!-- second-row presets for item background gradient second color -->
            <div id="itemBgPresets2" style="display:none;flex-wrap:wrap;gap:6px;margin-top:6px"></div>
          </div>
        </div>

        <div class="section">
          <label>Animation
            <select id="itemAnim">
              <option value="jump">Jump</option>
              <option value="shake">Shake</option>
              <option value="expand">Expand</option>
              <option value="shrink">Shrink</option>
            </select>
          </label>
        </div>
        <div class="section">
          <button id="addItem" class="primary">Add Item</button>
          <button id="doneItems">Done: Play</button>
        </div>

        <div class="section">
          <div class="subhead">Items</div>
          <div id="itemsList" class="itemsList"></div>
          <button id="backToCreator">Back to Creator</button>
        </div>
      </div>

      <div class="panel right">
        <div class="instructions">Drag items from the list onto the pet in Play mode to trigger the selected animation.</div>
        <div id="previewWrap">
          <svg id="petSVG_items" viewBox="-150 -150 300 300" width="100%" height="100%"></svg>
        </div>
      </div>
    </div>

    <div id="playArea" class="hidden">
      <div class="panel left">
        <div class="section">
          <button id="backToEditor">Back to Editor</button>
          <button id="startOver">Start Over</button>
        </div>
        <div class="section">
          <div class="subhead">Items</div>
          <div id="playItems" class="itemsList"></div>
        </div>
      </div>

      <div class="panel right">
        <div id="playWrap">
          <svg id="petSVG_play" viewBox="-150 -150 300 300" width="100%" height="100%"></svg>
        </div>
      </div>
    </div>

    <!-- Settings modal -->
    <div id="settingsModal" class="hidden" role="dialog" aria-modal="true">
      <div style="width:92%;max-width:420px;background:var(--panel);border-radius:12px;padding:14px;box-shadow:0 10px 30px rgba(0,0,0,0.28);">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
          <div style="font-weight:600">Settings</div>
          <button id="closeSettings" class="smallBtn" style="height:36px;padding:6px 10px">Close</button>
        </div>

        <div style="display:flex;flex-direction:column;gap:10px">
          <label>Pattern limit
            <input id="settingPatternLimit" type="number" min="0" max="10" value="2" style="width:84px;margin-left:8px;height:36px;border-radius:8px;padding:6px" />
          </label>

          <label>Accessory limit
            <input id="settingAccessoryLimit" type="number" min="0" max="10" value="3" style="width:84px;margin-left:8px;height:36px;border-radius:8px;padding:6px" />
          </label>

          <label>Heart emoji
            <input id="settingHeartEmoji" maxlength="4" placeholder="❤️" value="❤️" style="width:84px;margin-left:8px;height:36px;border-radius:8px;padding:6px" />
          </label>

          <div style="display:flex;gap:8px;align-items:center">
            <label style="flex:1">Heart float delay
              <input id="settingHeartDelay" type="number" min="0" value="700" style="width:100px;margin-left:8px;height:36px;border-radius:8px;padding:6px" />
            </label>
            <select id="settingHeartDelayUnit" style="height:36px;border-radius:8px;">
              <option value="ms">ms</option>
              <option value="s">s</option>
            </select>
          </div>

          <label>Theme
            <select id="settingTheme" style="margin-left:8px;height:36px;border-radius:8px">
              <option value="light">Light</option>
              <option value="dark">Dark</option>
            </select>
          </label>

          <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:6px">
            <button id="resetSettings" class="smallBtn">Reset</button>
            <button id="saveSettings" class="primary">Save</button>
          </div>
        </div>
      </div>
    </div>

  </div>

  <script src="app.js" type="module"></script>
</body>
</html>
