<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Emoji Sandbox</title>
  <link rel="stylesheet" href="styles.css">
  </head>
<body>
  <div id="sandbox"></div>

  <div id="toolbar">
    <button id="createBtn" class="tool-btn">Create</button>
    <button id="createEmoteBtn" class="tool-btn">Create emote</button>
    <button id="spawnBtn" class="tool-btn">Spawn</button>
    <button id="spawnBabyBtn" class="tool-btn">Spawn baby</button>
    <button id="autoMoveBtn" class="tool-btn toggle on">Auto-move</button>
    <button id="randomEmoteBtn" class="tool-btn toggle">Random emotes</button>
    <button id="clearBtn" class="tool-btn">Clear</button>
  </div>

  <div id="overlay" class="hidden"></div>

  <div id="modal" class="hidden"></div>

  <div id="emoteMenu" class="hidden"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
