<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <link rel="stylesheet" href="styles.css">
  <title>Emoji Pet</title>
</head>
<body>
  <div id="app">
    <!-- Creator -->
    <section id="creator" class="screen">
      <div class="card">
        <div class="preview-area">
          <div id="petPreview" class="pet">
            <div class="eye left">
              <div class="pupil"></div>
            </div>
            <div class="eye right">
              <div class="pupil"></div>
            </div>
            <div id="accessory" class="accessory"></div>
          </div>
        </div>

        <div class="controls">
          <label>Body color
            <input id="bodyColor" type="color" value="#ffd166">
          </label>

          <label>Eye color
            <input id="eyeColor" type="color" value="#ffffff">
          </label>

          <label>Pupil color
            <input id="pupilColor" type="color" value="#222222">
          </label>

          <label>Accessory emoji (optional)
            <input id="accEmoji" type="text" maxlength="2" placeholder="e.g. 🎀 or ◽️">
          </label>

          <label>Accessory color
            <input id="accColor" type="color" value="#ff0000">
          </label>

          <label>Accessory position
            <select id="accPos">
              <option value="top">top</option>
              <option value="bottom">bottom</option>
              <option value="left">left</option>
              <option value="right">right</option>
              <option value="top-left">top-left</option>
              <option value="top-right">top-right</option>
              <option value="bottom-left">bottom-left</option>
              <option value="bottom-right">bottom-right</option>
            </select>
          </label>

          <label>Accessory size
            <select id="accSize">
              <option value="0.45">smallest</option>
              <option value="0.55">smaller</option>
              <option value="0.7">small</option>
              <option value="0.9" selected>medium</option>
              <option value="1.15">big</option>
              <option value="1.35">bigger</option>
              <option value="1.6">biggest</option>
            </select>
          </label>

          <div class="row">
            <button id="btnDone" class="primary">Done</button>
            <button id="btnReset">Reset</button>
          </div>
        </div>
      </div>
    </section>

    <!-- Care area -->
    <section id="care" class="screen hidden">
      <div class="card">
        <div class="topbar">
          <div class="status">
            <div>Age: <span id="age">0</span>/<span id="deathAgeLabel">100</span></div>
            <div>Happiness: <span id="happiness">0</span>/100</div>
          </div>
          <div class="happiness-bar" aria-hidden>
            <div id="happinessFill"></div>
          </div>
          <button id="btnSettings" class="settings-btn" title="Settings">⚙️</button>
        </div>

        <!-- Settings modal -->
        <div id="settingsModal" class="modal hidden">
          <div class="modal-card settings-card">
            <h3>Settings</h3>
            <div class="controls settings-controls">
              <label>Death age
                <input id="deathAgeInput" type="number" min="1" max="999" value="100">
              </label>
              <label>Loved delta
                <input id="deltaLoved" type="number" value="10" step="1">
              </label>
              <label>Liked delta
                <input id="deltaLiked" type="number" value="5" step="1">
              </label>
              <label>Neutral delta
                <input id="deltaNeutral" type="number" value="0" step="1">
              </label>
              <label>Disliked delta
                <input id="deltaDisliked" type="number" value="-5" step="1">
              </label>
              <label>Hated delta
                <input id="deltaHated" type="number" value="-10" step="1">
              </label>
            </div>
            <div class="row">
              <button id="btnCloseSettings" class="primary">Done</button>
              <button id="btnResetSettings">Reset</button>
            </div>
          </div>
        </div>

        <div class="play-area">
          <div id="petArea" class="pet-large">
            <div id="pet" class="pet">
              <div class="eye left">
                <div class="pupil"></div>
              </div>
              <div class="eye right">
                <div class="pupil"></div>
              </div>
              <div id="accessoryCare" class="accessory"></div>
            </div>
          </div>

          <div class="input-area">
            <input id="interactionInput" type="text" placeholder="Enter emoji, word, or symbol" />
            <div class="row small">
              <button id="btnEnter" class="primary">Enter</button>
              <button id="btnLists">View lists</button>
              <button id="btnRestart" class="danger hidden">Restart</button>
            </div>
          </div>
        </div>

        <div id="listsPanel" class="lists hidden">
          <div class="list">
            <h4>Loved (+10)</h4>
            <ul id="lovedList"></ul>
          </div>
          <div class="list">
            <h4>Liked (+5)</h4>
            <ul id="likedList"></ul>
          </div>
          <div class="list">
            <h4>Neutral (+0)</h4>
            <ul id="neutralList"></ul>
          </div>
          <div class="list">
            <h4>Disliked (-5)</h4>
            <ul id="dislikedList"></ul>
          </div>
          <div class="list">
            <h4>Hated (-10)</h4>
            <ul id="hatedList"></ul>
          </div>
        </div>

      </div>
    </section>

    <!-- Death modal -->
    <div id="deathModal" class="modal hidden">
      <div class="modal-card">
        <h3 id="deathTitle">Your pet died</h3>
        <p id="deathMessage"></p>
        <div class="row">
          <button id="btnRestart2" class="primary">Start over</button>
        </div>
      </div>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
