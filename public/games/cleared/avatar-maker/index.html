<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f5f1">
  <title>Avatar Studio</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <main id="app" class="app-shell">
    <header class="topbar">
      <a class="brand" href="#library" aria-label="Avatar Studio home"><span class="brand-mark">✳</span> avatar studio</a>
      <div class="topbar-right"><span id="account-label" class="account-label"></span><button id="create-maker" class="button button-dark">＋ New maker</button></div>
    </header>
    <section id="view" class="view" aria-live="polite"></section>
    <div id="toast" class="toast" role="status"></div>
  </main>
  <input id="image-picker" type="file" accept="image/*" hidden>
</body>
</html>
