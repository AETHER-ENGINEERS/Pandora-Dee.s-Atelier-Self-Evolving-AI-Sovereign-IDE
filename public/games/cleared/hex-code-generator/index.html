<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <link rel="stylesheet" href="style.css" />
  <title>Hex Generator</title>
</head>
<body>
  <main id="app">
    <div id="swatch" aria-hidden="true"></div>
    <div id="info">
      <button id="hexBtn" class="big-btn" aria-live="polite">#FFFFFF</button>
      <div id="controls">
        <button id="generate" class="action-btn">Generate</button>
        <button id="copy" class="action-btn">Copy</button>
      </div>
    </div>
  </main>

  <script type="module" src="script.js"></script>
</body>
</html>
