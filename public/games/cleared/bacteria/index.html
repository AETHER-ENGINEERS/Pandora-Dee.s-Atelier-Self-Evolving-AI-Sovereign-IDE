<head><meta name="viewport" content="width=device-width, initial-scale=1"></head>
    <script src="p5.min.js"></script>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #001;
            color: #fff;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
            width: 100%;
            box-sizing: border-box;
        }
        .room {
            width: 100%;
            max-width: 800px;
            height: 500px;
            border: 3px solid #0ff;
            border-radius: 10px;
            margin: 10px 0;
            position: relative;
            overflow: hidden;
            background: #002;
        }
        .buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
            width: 100%;
            max-width: 300px; 
        }
        button {
            width: 100%;
            padding: 15px 20px; 
            background: #0ff;
            border: none;
            border-radius: 5px;
            color: #001;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #aff;
        }
        .breeding-panel {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #003;
            padding: 20px;
            border: 2px solid #0ff;
            border-radius: 10px;
        }
        .bacteria-select {
            margin: 10px;
            padding: 5px;
            background: #002;
            color: #fff;
            border: 1px solid #0ff;
        }
        .food-panel {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%; 
            transform: translate(-50%, -50%);
            background: #003;
            padding: 20px;
            border: 2px solid #0ff;
            border-radius: 10px;
            max-width: 400px;
            width: 100%;
        }
        .food-item {
            padding: 10px;
            margin: 5px 0;
            background: #004;
            border-radius: 5px;
            cursor: pointer;
        }
        .preference-bars {
            margin-top: 20px;
            display: flex;
            gap: 20px;
        }
        .likes, .dislikes {
            flex: 1;
        }
        .food-preference {
            padding: 5px;
            margin: 2px 0;
            border-radius: 3px;
        }
        .likes .food-preference {
            background: #0f0;
            color: #000;
        }
        .dislikes .food-preference {
            background: #f00;
            color: #fff;
        }
        .bait {
            cursor: pointer;
            padding: 10px;
            margin: 5px 0;
            background: #004;
            border-radius: 5px;
        }
        @media (min-width: 768px) {
            .buttons {
                flex-direction: row;
                max-width: none;
            }
            
            button {
                width: auto;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="buttons">
            <button onclick="switchRoom(&apos;outside&apos;)">Go Outside</button>
            <button onclick="switchRoom(&apos;collected&apos;)">Collected Bacteria</button>
            <button onclick="switchRoom(&apos;food&apos;)">Search for Food</button>
            <button onclick="showBreedingPanel()">Breed Bacteria</button>
            <button onclick="showBaitPanel()">Throw Out Bait</button>
            <button onclick="switchRoom(&apos;collectedFood&apos;)">Collected Food</button>
            <button onclick="showFoodMixingPanel()">Mix Foods</button>
        </div>
        <div id="currentRoom" class="room"></div>
    </div>
    <div id="breedingPanel" class="breeding-panel">
        <h3>Select Bacteria to Breed</h3>
        <select id="parent1" class="bacteria-select"></select>
        <select id="parent2" class="bacteria-select"></select>
        <button onclick="breedBacteria()">Breed</button>
        <button onclick="hideBreedingPanel()">Cancel</button>
    </div>
    <div id="foodPanel" class="food-panel">
        <h3>What do you want to feed it?</h3>
        <div id="foodList"></div>
        <div class="preference-bars">
            <div class="likes">
                <h4>Likes</h4>
                <div id="likesBar"></div>
            </div>
            <div class="dislikes">
                <h4>Dislikes</h4> 
                <div id="dislikesBar"></div>
            </div>
        </div>
        <button onclick="hideFoodPanel()">Close</button>
    </div>
    <div id="baitPanel" class="breeding-panel">
        <h3>Select Food to Use as Bait</h3>
        <div id="baitFoodList"></div>
        <button onclick="hideBaitPanel()">Cancel</button>
    </div>
    <div id="foodMixingPanel" class="breeding-panel">
        <h3>Select Foods to Mix</h3>
        <select id="food1" class="bacteria-select"></select>
        <select id="food2" class="bacteria-select"></select>
        <button onclick="mixFoods()">Mix</button>
        <button onclick="hideFoodMixingPanel()">Cancel</button>
    </div>

    <script>let bacteria = [];
let collectedBacteria = [];
let currentRoom = 'outside';
let canvas;
let discoveredFood = [];
let foods = [];
let selectedBacterium = null;
let activeBait = null;
let bacteriaTargetingBait = null;
class Bacterium {
  constructor(x, y, traits) {
    this.x = x;
    this.y = y;
    this.traits = traits || {
      size: random(20, 40),
      color: color(random(100, 255), random(100, 255), random(100, 255)),
      speed: random(1, 3),
      arms: floor(random(3, 8)),
      wiggle: random(0.02, 0.05),
      shape: floor(random(5)),
      pattern: floor(random(4)),
      patternColor: color(random(100, 255), random(100, 255), random(100, 255))
    };
    this.angle = random(TWO_PI);
    this.name = '';
    this.likes = [];
    this.dislikes = [];
    this.isEating = false;
    this.eatingAnimation = 0;
  }
  move() {
    this.angle += random(-this.traits.wiggle, this.traits.wiggle);
    this.x += cos(this.angle) * this.traits.speed;
    this.y += sin(this.angle) * this.traits.speed;
    if (this.x < 0) this.x = width;
    if (this.x > width) this.x = 0;
    if (this.y < 0) this.y = height;
    if (this.y > height) this.y = 0;
  }
  drawShape(size) {
    switch (this.traits.shape) {
      case 0:
        ellipse(0, 0, size, size);
        break;
      case 1:
        rectMode(CENTER);
        rect(0, 0, size, size);
        break;
      case 2:
        let triSize = size / 2;
        triangle(-triSize, triSize, triSize, triSize, 0, -triSize);
        break;
      case 3:
        let angle = TWO_PI / 5;
        beginShape();
        for (let a = 0; a < TWO_PI; a += angle) {
          let sx = cos(a) * size / 2;
          let sy = sin(a) * size / 2;
          vertex(sx, sy);
          sx = cos(a + angle / 2) * size / 4;
          sy = sin(a + angle / 2) * size / 4;
          vertex(sx, sy);
        }
        endShape(CLOSE);
        break;
      case 4:
        ellipse(0, 0, size, size);
        beginShape();
        for (let i = 0; i <= 10; i++) {
          let x = -size / 2 - i * size / 8;
          let y = sin(i * 0.5) * (size / 8);
          vertex(x, y);
        }
        for (let i = 10; i >= 0; i--) {
          let x = -size / 2 - i * size / 8;
          let y = -sin(i * 0.5) * (size / 8);
          vertex(x, y);
        }
        endShape(CLOSE);
        break;
      default:
        ellipse(0, 0, size, size);
    }
  }
  drawPattern(size) {
    switch (this.traits.pattern) {
      case 1:
        fill(this.traits.patternColor);
        for (let i = 0; i < 5; i++) {
          let spotX = random(-size / 3, size / 3);
          let spotY = random(-size / 3, size / 3);
          ellipse(spotX, spotY, size / 5);
        }
        break;
      case 2:
        fill(this.traits.patternColor);
        for (let i = -size / 2; i < size / 2; i += size / 4) {
          rect(i, -size / 2, size / 8, size);
        }
        break;
      case 3:
        noFill();
        stroke(this.traits.patternColor);
        strokeWeight(2);
        for (let i = size / 4; i <= size; i += size / 4) {
          ellipse(0, 0, i, i);
        }
        break;
    }
  }
  display() {
    push();
    translate(this.x, this.y);
    rotate(this.angle);
    fill(this.traits.color);
    noStroke();
    this.drawShape(this.traits.size);
    this.drawPattern(this.traits.size);
    for (let i = 0; i < this.traits.arms; i++) {
      let angle = TWO_PI / this.traits.arms * i;
      let armLength = this.traits.size * 0.7;
      let x2 = cos(angle) * armLength;
      let y2 = sin(angle) * armLength;
      stroke(this.traits.color);
      strokeWeight(3);
      line(0, 0, x2, y2);
      noStroke();
      this.drawShape(this.traits.size * 0.3);
    }
    if (this.name) {
      fill(255);
      noStroke();
      textAlign(CENTER);
      text(this.name, 0, -this.traits.size);
    }
    pop();
    if (this.isEating) {
      push();
      translate(this.x, this.y);
      noFill();
      stroke(this.traits.color);
      strokeWeight(2);
      let size = this.traits.size + sin(this.eatingAnimation) * 10;
      ellipse(0, 0, size, size);
      this.eatingAnimation += 0.2;
      if (this.eatingAnimation > TWO_PI) {
        this.isEating = false;
        this.eatingAnimation = 0;
      }
      pop();
    }
  }
  clicked(px, py) {
    let d = dist(px, py, this.x, this.y);
    return d < this.traits.size;
  }
  moveTowardsBait() {
    if (!activeBait) return;
    let dx = activeBait.x - this.x;
    let dy = activeBait.y - this.y;
    let angle = atan2(dy, dx);
    this.x += cos(angle) * this.traits.speed * 2;
    this.y += sin(angle) * this.traits.speed * 2;
    if (dist(this.x, this.y, activeBait.x, activeBait.y) < this.traits.size / 2) {
      this.eatBait();
    }
  }
  eatBait() {
    this.isEating = true;
    this.eatingAnimation = 0;
    let name = prompt("Name your new bacteria:");
    if (name) {
      this.name = name;
      if (Math.random() < 0.5) {
        this.likes.push(activeBait);
      } else {
        this.dislikes.push(activeBait);
      }
      collectedBacteria.push(this);
      bacteria = bacteria.filter(b => b !== this);
      updateBreedingSelects();
    }
    bacteriaTargetingBait = null;
    activeBait = null;
  }
}
class Food {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.size = Math.random() * (25 - 10) + 10;
    this.color = color(Math.random() * 155 + 100, Math.random() * 155 + 100, Math.random() * 155 + 100);
    this.name = '';
    this.shape = Math.floor(Math.random() * 3);
    this.pattern = Math.floor(Math.random() * 4);
    this.patternColor = color(Math.random() * 155 + 100, Math.random() * 155 + 100, Math.random() * 155 + 100);
    this.eatCount = 0;
    this.isMixed = false;
  }
  display() {
    push();
    translate(this.x, this.y);
    fill(this.color);
    noStroke();
    switch (this.shape) {
      case 0:
        ellipse(0, 0, this.size, this.size);
        break;
      case 1:
        rectMode(CENTER);
        rect(0, 0, this.size, this.size);
        break;
      case 2:
        let triSize = this.size / 2;
        triangle(-triSize, triSize, triSize, triSize, 0, -triSize);
        break;
    }
    switch (this.pattern) {
      case 1:
        fill(this.patternColor);
        for (let i = 0; i < 5; i++) {
          let spotX = random(-this.size / 3, this.size / 3);
          let spotY = random(-this.size / 3, this.size / 3);
          ellipse(spotX, spotY, this.size / 5);
        }
        break;
      case 2:
        fill(this.patternColor);
        for (let i = -this.size / 2; i < this.size / 2; i += this.size / 4) {
          rect(i, -this.size / 2, this.size / 8, this.size);
        }
        break;
      case 3:
        noFill();
        stroke(this.patternColor);
        strokeWeight(2);
        for (let i = this.size / 4; i <= this.size; i += this.size / 4) {
          ellipse(0, 0, i, i);
        }
        break;
    }
    if (this.name) {
      fill(255);
      textAlign(CENTER);
      text(this.name, 0, -this.size - 5);
    }
    pop();
  }
  clicked(px, py) {
    return dist(px, py, this.x, this.y) < this.size;
  }
}
function setup() {
  canvas = createCanvas(800, 500);
  canvas.parent('currentRoom');
  generateNewBacteria();
}
function draw() {
  background(0, 0, 34);
  if (currentRoom === 'outside') {
    if (activeBait) {
      activeBait.display();
    }
    for (let b of bacteria) {
      if (b === bacteriaTargetingBait || Array.isArray(bacteriaTargetingBait) && bacteriaTargetingBait.includes(b)) {
        b.moveTowardsBait();
      } else {
        b.move();
      }
      b.display();
    }
  } else if (currentRoom === 'collected') {
    for (let b of collectedBacteria) {
      b.move();
      b.display();
    }
  } else if (currentRoom === 'food') {
    for (let f of foods) {
      f.display();
    }
  } else if (currentRoom === 'collectedFood') {
    for (let f of discoveredFood) {
      f.display();
    }
  }
}
function mousePressed() {
  if (currentRoom === 'outside') {
    for (let i = bacteria.length - 1; i >= 0; i--) {
      if (bacteria[i].clicked(mouseX, mouseY)) {
        let name = prompt("Name your new bacteria:");
        if (name) {
          bacteria[i].name = name;
          collectedBacteria.push(bacteria[i]);
          bacteria.splice(i, 1);
          updateBreedingSelects();
        }
        break;
      }
    }
  } else if (currentRoom === 'food') {
    for (let i = foods.length - 1; i >= 0; i--) {
      if (foods[i].clicked(mouseX, mouseY)) {
        let name = prompt("Name this food:");
        if (name) {
          foods[i].name = name;
          discoveredFood.push(foods[i]);
          foods.splice(i, 1);
        }
        break;
      }
    }
  } else if (currentRoom === 'collected') {
    for (let bacterium of collectedBacteria) {
      if (bacterium.clicked(mouseX, mouseY)) {
        showFoodPanel(bacterium);
        break;
      }
    }
  }
}
function generateNewBacteria() {
  bacteria = [];
  for (let i = 0; i < 5; i++) {
    bacteria.push(new Bacterium(random(width), random(height)));
  }
}
function generateNewFood() {
  foods = [];
  for (let i = 0; i < 3; i++) {
    let visibleLeft = 0;
    let visibleRight = width;
    let visibleTop = 0;
    let visibleBottom = height;
    foods.push(new Food(Math.random() * (visibleRight - visibleLeft - 50) + visibleLeft + 25, Math.random() * (visibleBottom - visibleTop - 50) + visibleTop + 25));
  }
}
function switchRoom(room) {
  currentRoom = room;
  if (room === 'outside') {
    generateNewBacteria();
  } else if (room === 'food') {
    generateNewFood();
  }
  resizeCanvas(800, 500);
  canvas.parent('currentRoom');
}
function showBreedingPanel() {
  document.getElementById('breedingPanel').style.display = 'block';
}
function hideBreedingPanel() {
  document.getElementById('breedingPanel').style.display = 'none';
}
function updateBreedingSelects() {
  let parent1 = document.getElementById('parent1');
  let parent2 = document.getElementById('parent2');
  parent1.innerHTML = '';
  parent2.innerHTML = '';
  collectedBacteria.forEach((b, i) => {
    let option1 = new Option(b.name || `Bacteria ${i + 1}`, i);
    let option2 = new Option(b.name || `Bacteria ${i + 1}`, i);
    parent1.add(option1);
    parent2.add(option2);
  });
}
function breedBacteria() {
  let parent1Index = document.getElementById('parent1').value;
  let parent2Index = document.getElementById('parent2').value;
  if (parent1Index === parent2Index) {
    alert("Please select different bacteria to breed!");
    return;
  }
  let parent1 = collectedBacteria[parent1Index];
  let parent2 = collectedBacteria[parent2Index];
  let childTraits = {
    size: (parent1.traits.size + parent2.traits.size) / 2,
    color: lerpColor(parent1.traits.color, parent2.traits.color, 0.5),
    speed: (parent1.traits.speed + parent2.traits.speed) / 2,
    arms: floor((parent1.traits.arms + parent2.traits.arms) / 2),
    wiggle: (parent1.traits.wiggle + parent2.traits.wiggle) / 2,
    shape: random([parent1.traits.shape, parent2.traits.shape]),
    pattern: random([parent1.traits.pattern, parent2.traits.pattern]),
    patternColor: lerpColor(parent1.traits.patternColor, parent2.traits.patternColor, 0.5)
  };
  let child = new Bacterium(random(width), random(height), childTraits);
  let name = prompt("Name the new bacteria:");
  if (name) {
    child.name = name;
    collectedBacteria.push(child);
    updateBreedingSelects();
    hideBreedingPanel();
  }
}
function showFoodPanel(bacterium) {
  selectedBacterium = bacterium;
  document.getElementById('foodPanel').style.display = 'block';
  updateFoodList();
  updatePreferenceBars();
}
function hideFoodPanel() {
  document.getElementById('foodPanel').style.display = 'none';
  selectedBacterium = null;
}
function updateFoodList() {
  const foodList = document.getElementById('foodList');
  foodList.innerHTML = '';
  discoveredFood.forEach(food => {
    const div = document.createElement('div');
    div.className = 'food-item';
    div.textContent = food.name;
    div.onclick = () => feedBacteria(food);
    foodList.appendChild(div);
  });
}
function updatePreferenceBars() {
  if (!selectedBacterium) return;
  const likesBar = document.getElementById('likesBar');
  const dislikesBar = document.getElementById('dislikesBar');
  likesBar.innerHTML = selectedBacterium.likes.map(food => `<div class="food-preference">${food.name}</div>`).join('');
  dislikesBar.innerHTML = selectedBacterium.dislikes.map(food => `<div class="food-preference">${food.name}</div>`).join('');
}
function feedBacteria(food) {
  if (!selectedBacterium) return;
  if (!food.isMixed || food.isMixed && food.eatCount >= 1) {
    const foodIndex = discoveredFood.findIndex(f => f === food);
    if (foodIndex > -1) {
      discoveredFood.splice(foodIndex, 1);
    }
  } else {
    food.eatCount++;
  }
  if (Math.random() < 0.5) {
    selectedBacterium.likes.push(food);
  } else {
    selectedBacterium.dislikes.push(food);
  }
  selectedBacterium.isEating = true;
  selectedBacterium.eatingAnimation = 0;
  updatePreferenceBars();
  updateFoodList();
  hideFoodPanel();
}
function showBaitPanel() {
  document.getElementById('baitPanel').style.display = 'block';
  updateBaitFoodList();
}
function hideBaitPanel() {
  document.getElementById('baitPanel').style.display = 'none';
}
function updateBaitFoodList() {
  const foodList = document.getElementById('baitFoodList');
  foodList.innerHTML = '';
  discoveredFood.forEach(food => {
    const div = document.createElement('div');
    div.className = 'bait';
    div.textContent = food.name;
    div.onclick = () => throwBait(food);
    foodList.appendChild(div);
  });
}
function throwBait(food) {
  const foodIndex = discoveredFood.findIndex(f => f === food);
  if (foodIndex > -1 && (!food.isMixed || food.isMixed && food.eatCount >= 1)) {
    discoveredFood.splice(foodIndex, 1);
  } else if (food.isMixed) {
    food.eatCount++;
  }
  activeBait = new Food(random(width), random(height));
  Object.assign(activeBait, food);
  if (food.size > 40) {
    bacteriaTargetingBait = [bacteria[floor(random(bacteria.length))], bacteria[floor(random(bacteria.length))]];
  } else {
    bacteriaTargetingBait = [bacteria[floor(random(bacteria.length))]];
  }
  hideBaitPanel();
}
function showFoodMixingPanel() {
  document.getElementById('foodMixingPanel').style.display = 'block';
  updateFoodMixingSelects();
}
function hideFoodMixingPanel() {
  document.getElementById('foodMixingPanel').style.display = 'none';
}
function updateFoodMixingSelects() {
  let food1 = document.getElementById('food1');
  let food2 = document.getElementById('food2');
  food1.innerHTML = '';
  food2.innerHTML = '';
  discoveredFood.forEach((f, i) => {
    let option1 = new Option(f.name || `Food ${i + 1}`, i);
    let option2 = new Option(f.name || `Food ${i + 1}`, i);
    food1.add(option1);
    food2.add(option2);
  });
}
function mixFoods() {
  let food1Index = document.getElementById('food1').value;
  let food2Index = document.getElementById('food2').value;
  if (food1Index === food2Index) {
    alert("Please select different foods to mix!");
    return;
  }
  let food1 = discoveredFood[food1Index];
  let food2 = discoveredFood[food2Index];
  let mixedFood = new Food(random(width), random(height));
  mixedFood.size = (food1.size + food2.size) * 1.5;
  mixedFood.color = lerpColor(food1.color, food2.color, 0.5);
  mixedFood.shape = random([food1.shape, food2.shape]);
  mixedFood.pattern = random([food1.pattern, food2.pattern]);
  mixedFood.patternColor = lerpColor(food1.patternColor, food2.patternColor, 0.5);
  mixedFood.isMixed = true;
  let name = prompt("Name the mixed food:");
  if (name) {
    mixedFood.name = name;
    discoveredFood = discoveredFood.filter((_, i) => i != food1Index && i != food2Index);
    discoveredFood.push(mixedFood);
    hideFoodMixingPanel();
    updateFoodMixingSelects();
  }
}
